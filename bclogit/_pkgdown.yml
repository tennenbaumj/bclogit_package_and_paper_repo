url: https://tennenbaumj.github.io/bclogit_package_and_paper_repo/

template:
  bootstrap: 5
  math-rendering: mathjax

home:
  title: "bclogit: Bayesian Conditional Logistic Regression"
  description: >
    bclogit fits conditional logistic regression models for matched
    case-control data that optionally incorporate information from
    concordant pairs (and a reservoir of additional controls) as an
    informative Bayesian prior, improving estimation of the discordant
    pairs. Also includes a fast vanilla clogit() drop-in replacement for
    survival::clogit() with a 5-11x speedup.

navbar:
  structure:
    left:  [intro, reference, news]
    right: [search, github]

reference:
- title: "Model Fitting"
  desc: Fit conditional logistic regression models, with or without a Bayesian prior built from concordant pairs.
  contents:
  - bclogit
  - clogit

- title: "Inference and Summaries"
  contents:
  - summary.bclogit
  - summary.clogit_bclogit
  - print.summary.bclogit
  - print.summary.clogit_bclogit
  - coef.bclogit
  - coef.clogit_bclogit
  - confint.bclogit
  - vcov.bclogit
  - vcov.clogit_bclogit
  - formula.bclogit

- title: "Data"
  contents:
  - fhs

- title: "Package Overview"
  contents:
  - bclogit-package
